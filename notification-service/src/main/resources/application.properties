spring.application.name=notification-service

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
notification.kafka.signup-topic=signup

# Left blank on purpose - never commit real SMTP credentials. Set these as
# environment variables (MAIL_USERNAME / MAIL_APP_PASSWORD) wherever this
# actually runs. A Gmail app password (not the account password) is what
# goes in MAIL_APP_PASSWORD - generate one under Google Account > Security
# > App passwords.
notification.mail.host=smtp.gmail.com
notification.mail.port=587
notification.mail.username=${MAIL_USERNAME:}
notification.mail.app-password=${MAIL_APP_PASSWORD:}
