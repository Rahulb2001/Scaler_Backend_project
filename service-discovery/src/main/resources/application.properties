spring.application.name=service-discovery
server.port=${SERVER_PORT:8761}

# This node is the registry itself, so it doesn't need to register with
# or pull a registry from another Eureka instance.
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# Self-preservation is meant for multi-node production clusters. On a
# single-node local/dev setup it just hides stale-instance warnings we
# actually want to see, so it's switched off here.
eureka.server.enable-self-preservation=false
eureka.server.eviction-interval-timer-in-ms=5000

management.endpoints.web.exposure.include=health,info
