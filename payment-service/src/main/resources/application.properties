spring.application.name=paymentservice
server.port=${SERVER_PORT:8083}

# Placeholder test-mode credentials - replace with real ones (as env vars,
# never committed) before this hits an actual Razorpay/Stripe account.
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_placeholder_key}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:placeholder_secret}
stripe.api.key=${STRIPE_API_KEY:sk_test_placeholder_key}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:whsec_placeholder_secret}

eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info
